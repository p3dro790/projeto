<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Pegar Bloco em JavaScript</title>

    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }

        h1 {
            margin-bottom: 10px;
        }

        canvas {
            border: 4px solid #fff;
            background-color: #111;
        }
    </style>
</head>

<body>

    <h1>Pontuação: <span id="score">0</span></h1>

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <script>
        // =========================
        // CANVAS
        // =========================

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreElement = document.getElementById("score");


        // =========================
        // JOGADOR
        // =========================

        const player = {
            x: 180,
            y: 450,
            width: 40,
            height: 40,
            speed: 8,
            color:"RGB"
        };


        // =========================
        // BLOCO QUE CAI
        // =========================

        const item = {
            x: Math.random() * (canvas.width - 30),
            y: 0,
            width: 30,
            height: 30,
            speed: 4,
            color: "#00cc44"
        };


        let score = 0;


        // =========================
        // TECLAS
        // =========================

        const keys = {};

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });


        // =========================
        // ATUALIZAR JOGO
        // =========================

        function update() {

            // Movimento para a esquerda
            if (
                keys["ArrowLeft"] ||
                keys["a"] ||
                keys["A"]
            ) {
                player.x -= player.speed;
            }


            // Movimento para a direita
            if (
                keys["ArrowRight"] ||
                keys["d"] ||
                keys["D"]
            ) {
                player.x += player.speed;
            }


            // Impedir o jogador de sair pela esquerda
            if (player.x < 0) {
                player.x = 0;
            }


            // Impedir o jogador de sair pela direita
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }


            // =========================
            // BLOCO CAINDO
            // =========================

            item.y += item.speed;


            // =========================
            // DETECTAR COLISÃO
            // =========================

            if (
                item.x < player.x + player.width &&
                item.x + item.width > player.x &&
                item.y < player.y + player.height &&
                item.y + item.height > player.y
            ) {

                // Adicionar 5 pontos
                score += 5;

                // Atualizar pontuação na tela
                scoreElement.innerText = score;
                mudarCorPlayer();

                // Aumentar velocidade do bloco
                item.speed += 0.5;

                // Criar um novo bloco
                resetItem();
            }


            // =========================
            // BLOCO PASSOU DA TELA
            // =========================

            if (item.y > canvas.height) {
                resetItem();
            }
        }


        // =========================
        // RESETAR BLOCO
        // =========================

        function resetItem() {

            item.x = Math.random() * (canvas.width - item.width);
            item.y = 0;
        }


        // =========================
        // DESENHAR
        // =========================

        function draw() {

            // Limpar tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);


            // Desenhar jogador
            ctx.fillStyle = player.color;
            ctx.fillRect(
                player.x,
                player.y,
                player.width,
                player.height
            );


            // Desenhar bloco
            ctx.fillStyle = item.color;
            ctx.fillRect(
                item.x,
                item.y,
                item.width,
                item.height
            );
        }


        // =========================
        // LOOP DO JOGO
        // =========================

        function gameLoop() {

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }
        function mudarCorPlayer() {
    const cores = [
        "#ff0000",
        "#00ff00",
        "#0088ff",
        "#ffff00",
        "#ff00ff",
        "#00ffff",
        "#ff8800",
        "#ffffff"
    ];

    player.color = cores[Math.floor(Math.random() * cores.length)];
}


        // Iniciar jogo
        gameLoop();

    </script>

</body>
</html>
