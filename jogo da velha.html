<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: aqua;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        #status {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #333;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .celula {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
            transition: background-color 0.2s;
        }

        .celula:hover {
            background-color: #e0e0e0;
        }

        .celula.x {
            color: #e74c3c;
        }

        .celula.o {
            color: #3498db;
        }

        #reiniciar {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #reiniciar:hover {
            background-color: #27ae60;
        }
    </style>
</head>

<body>

    <h1>JOGO DA TUA VÓ</h1>

    <div id="status">Vez do jogador: X</div>

    <div class="tabuleiro" id="tabuleiro">
        <div class="celula" data-index="0"></div>
        <div class="celula" data-index="1"></div>
        <div class="celula" data-index="2"></div>
        <div class="celula" data-index="3"></div>
        <div class="celula" data-index="4"></div>
        <div class="celula" data-index="5"></div>
        <div class="celula" data-index="6"></div>
        <div class="celula" data-index="7"></div>
        <div class="celula" data-index="8"></div>
    </div>

    <button id="reiniciar">Reiniciar</button>

    <script>
        const tabuleiroEl = document.getElementById('tabuleiro');
        const statusEl = document.getElementById('status');
        const reiniciarBtn = document.getElementById('reiniciar');
        const celulas = document.querySelectorAll('.celula');

        let tabuleiro = ['', '', '', '', '', '', '', '', ''];
        let jogadorAtual = 'X';
        let jogadas = 0;
        let jogoAtivo = true;

        const vitorias = [
            [0, 1, 2], // linha 1
            [3, 4, 5], // linha 2
            [6, 7, 8], // linha 3

            [0, 3, 6], // coluna 1
            [1, 4, 7], // coluna 2
            [2, 5, 8], // coluna 3

            [0, 4, 8], // diagonal
            [2, 4, 6]  // diagonal
        ];

        function verificarVitoria(jogador) {
            return vitorias.some(combinacao => {
                return (
                    tabuleiro[combinacao[0]] === jogador &&
                    tabuleiro[combinacao[1]] === jogador &&
                    tabuleiro[combinacao[2]] === jogador
                );
            });
        }

        function lidarComClique(e) {
            const index = e.target.getAttribute('data-index');

            // Impede jogar se o jogo acabou ou se a casa já está ocupada
            if (!jogoAtivo || tabuleiro[index] !== '') {
                return;
            }

            // Coloca X ou O no tabuleiro
            tabuleiro[index] = jogadorAtual;

            // Mostra X ou O na tela
            e.target.textContent = jogadorAtual;

            // Adiciona a classe para mudar a cor
            e.target.classList.add(jogadorAtual.toLowerCase());

            jogadas++;

            // Verifica se o jogador venceu
            if (verificarVitoria(jogadorAtual)) {
                statusEl.textContent = `Jogador ${jogadorAtual} venceu!`;
                jogoAtivo = false;
                return;
            }

            // Verifica empate
            if (jogadas === 9) {
                statusEl.textContent = 'O jogo terminou empatado!';
                jogoAtivo = false;
                return;
            }

            // Troca o jogador
            jogadorAtual = jogadorAtual === 'X' ? 'O' : 'X';

            statusEl.textContent = `Vez do jogador: ${jogadorAtual}`;
        }

        function reiniciarJogo() {
            tabuleiro = ['', '', '', '', '', '', '', '', ''];
            jogadorAtual = 'X';
            jogadas = 0;
            jogoAtivo = true;

            statusEl.textContent = `Vez do jogador: ${jogadorAtual}`;

            celulas.forEach(celula => {
                celula.textContent = '';
                celula.classList.remove('x', 'o');
            });
        }

        // Adiciona o evento de clique em cada célula
        celulas.forEach(celula => {
            celula.addEventListener('click', lidarComClique);
        });

        // Adiciona o evento ao botão Reiniciar
        reiniciarBtn.addEventListener('click', reiniciarJogo);
    </script>

</body>
</html>
